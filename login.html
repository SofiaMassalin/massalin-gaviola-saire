    <link rel="stylesheet" href="./css/styles.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <header>
        <a href="./index.html" class="logocontainer">
            <img class="logo" src="./img/img logo/logo png.png" alt="">

    <main> 
        <div class="contenedor_inicio">
            <h2 class="titulo_form">Inicia sesión</h2>
            <form action= "./index.html" method="get" class="hijo_formulario">
                <div class="hijologin">
                    <label for="mail">Email:</label>
                    <input id="mail" class="input_login" type="email" name="mail" value="">
                </div>

                <div class="hijologin">
                    <label for="pass">Contraseña:</label>
                    <input id="pass" class="input_login" type="password" name="pass" value="">
                </div>

                <div class="hijologin">
                    <button class="boton_login" type="submit">Ingresar</button>
                </div>

                <div class="hijologin">
                    <a href="./register.html">No tengo cuenta</a>
                </div>
            </form>
        </div>
    </main>
