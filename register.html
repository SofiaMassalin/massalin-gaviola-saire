<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="./css/styles.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,300..800;1,300..800&family=Plus+Jakarta+Sans:ital,wght@0,200..800;1,200..800&family=Raleway:ital,wght@0,700;1,700&family=Work+Sans:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
</head>
<body>
    <header>
        <a href="./index.html" class="logocontainer">
            <img class="logo" src="./img/img logo/logo png.png" alt=""> 
        </a> 
        
    </header>


    <main> 
        <div class = "contenedor_registro">
            <h2 class="titulo_form">Registrate</h2>
            <form action = "./login.html" method="get" class="hijo_formulario">
                <div class="hijoregistro">
                    <label for="mail">Email:</label> <!-- uso un for y el id porque cuando son los mismos me relaciona las dos cosas-->
                    <input id="mail" class="input_registro" type="email" name="mail" value="">
                </div>

                <div class="hijoregistro">
                    <label for="contraseña">Contraseña:</label>
                    <input id="contraseña" class="input_registro" type="password" name="pass" value=""> 
                </div>

                <div class="hijoregistro">
                    <label for="repetir">Repetir contraseña:</label>
                    <input id="repetir" class="input_registro" type="password" name="pass" value=""> 
                </div>

                <div class="hijoregistro">
                    <label>Acepto términos y condiciones</label>
            
                    <input id="si" type="checkbox" name="términos" value="Sí"> 
                    <label for="si">Si</label>
                    
                    <input id="no" type="checkbox" name="términos" value="No">
                    <label for="no">No</label> 
                </div>

                <div class="hijoregistro">
                    <button class="boton_registro" type="submit">Registrarme</button>
                </div>

                <div class="hijoregistro">
                    <a href="./login.html">Ya tengo cuenta</a>
                </div>
            </form>
        </div>
    </main>


    <footer> 
        <div class="contenedor_footer">
            <p> Sofia Massalin, Mercedes Gaviola, Belén Saire</p>
        </div>
    </footer>
</body>
</html>
